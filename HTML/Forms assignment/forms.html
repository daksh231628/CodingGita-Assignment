<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Registration Form</h1>

    <b><form>

        First Name :

        <input type="text" name="first name" placeholder="Enter First Name">
        <br>

       Last Name :
        <input type="text" name="last name" placeholder="Enter Last Name">
        <br>

        Email :
        <input type="email" name="email" placeholder="Enter Email Address">
        <br>

        Password :
        <input type="password" name="password">
        <br>

       Gender :<br>

        <input type="radio" name="gender" value="Male">
        Male
        <br>

        <input type="radio" name="gender" value="Female">
        Female
        <br>

        <input type="radio" name="gender" value="Other">
       Other
        <br>

        Age :
        <input type="number" name="age">
        <br>

        Preferences :<br>

        <input type="checkbox" name="painting" value="Acrylic Painting">
        Acrylic Painting
        <br>

        <input type="checkbox" name="painting" value="Oil Painting">
        Oil Painting
        <br>

        <input type="checkbox" name="painting" value="Water Color Painting">
        Water Color Painting
        <br>

        Select Occupation :

        <select name="occupation">
            <option>Student</option>
            <option>Teacher</option>
            <option>Business</option>
            <option>Other</option>
        </select>

        <br>

        Bio :
        <br>

        <textarea name="bio" rows="7" cols="35"
        placeholder="Share few lines about yourself..."></textarea>

        <br>

        <input type="reset" value="RESET">
        <input type="submit" value="SUBMIT">

    </form></b>



</body>
</html>
